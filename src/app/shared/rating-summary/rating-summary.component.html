<div class="rating-summary">
  <h3>Customer Reviews ({{ totalReviews }})</h3>

  <div class="average-rating">
    <div class="rating-number">{{ averageRating.toFixed(1) }} / 5</div>
    <app-star-rating
      [rating]="averageRating"
      [readonly]="true"
      [supportHalfStar]="true"
      [reviewCount]="totalReviews">
    </app-star-rating>
  </div>

  <div class="rating-distribution" *ngFor="let star of [5,4,3,2,1]">
    <div class="distribution-row">
      <span class="star-label">{{ star }} <i class="star-icon">&#9733;</i></span>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="ratingPercentages[star]">
          {{ ratingPercentages[star] }}%
        </div>
      </div>
    </div>
  </div>
</div>
