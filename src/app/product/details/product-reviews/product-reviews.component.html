<div *ngIf="userLoggedIn; else loginPrompt">
  <h4>Write a Review</h4>

  <!-- ⭐ Clickable Stars -->
  <div class="star-rating-input">
    <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
      <i class="star-icon" [ngClass]="{'filled': star <= newReviewRating}"
        (click)="newReviewRating = star">&#9733;</i>
    </ng-container>
  </div>

  <!-- 📝 Review Text Area -->
  <textarea [(ngModel)]="newReviewText" rows="4" placeholder="Write your review..." class="review-input"></textarea>

  <!-- ✅ Submit Button -->
  <button class="btn btn-secondary" (click)="submitReview()" [disabled]="newReviewRating === 0 || newReviewText.trim() === ''">
    Submit Review
  </button>
</div>

<!-- 🔒 If not logged in -->
<ng-template #loginPrompt>
  <p class="fs-5">Please log in to write a review.</p>
</ng-template>

<app-rating-summary class="d-block mt-3" [reviews]="reviews || []"></app-rating-summary>

<div *ngIf="(reviews || []).length > 0; else noReviews" class="review-list">
  <div *ngFor="let review of reviews" class="review-card">

    <!-- Show star rating -->
    <app-star-rating [rating]="review.rating"></app-star-rating>

    <!-- Editable or display mode -->
    <div *ngIf="editingReviewId === review.id; else displayMode">
      <div class="star-rating-input">
        <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
          <i class="star-icon" [ngClass]="{'filled': star <= editableRating}"
            (click)="editableRating = star">&#9733;</i>
        </ng-container>
      </div>
      <textarea [(ngModel)]="editableText" rows="3"></textarea>
      <button class="btn btn-primary btn-sm me-1" (click)="updateReview(review.id)">Save</button>
      <button class="btn btn-dark btn-sm" (click)="cancelReviewEdit()">Cancel</button>
    </div>

    <ng-template #displayMode>
      <p>{{ review.review_text }}</p>
      <div class="d-flex align-items-center justify-content-between">
        <small>{{ review.user?.name }} • {{ review.created_at | date:'mediumDate' }}</small>

        <!-- Show edit/delete buttons if review belongs to the logged-in user -->
        <div *ngIf="review.user_id === currentUserId">
          <button class="btn btn-info btn-sm me-1" (click)="enableReviewEdit(review)">Edit</button>
          <button class="btn btn-danger btn-sm" (click)="deleteReview(review.id)">Delete</button>
        </div>
      </div>
    </ng-template>

  </div>
</div>

<ng-template #noReviews>
  <p>No reviews yet. Be the first to review this product!</p>
</ng-template>
