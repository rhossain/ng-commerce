<ng-container *ngFor="let product of products">
    <div class="deal-card">
        <div class="overlay">
            
        </div>
        <div class="details">
            <div class="image">
                <img [src]="product.main_image_url || product.variants?.[0]?.product_images?.[0]?.image_url"
                alt="{{ product.name }}" />
            </div>
            <div class="content">
                <h2 class="name">{{ product.name }}</h2>
                <p class="price">
                    <ng-container *ngIf="product.variants?.[0]?.discountPrice; else regular">
                        <span class="discounted">${{ product.variants?.[0]?.discountPrice }}</span>
                        <span class="original">${{ product.variants?.[0]?.price }}</span>
                    </ng-container>
                    <ng-template #regular>
                        <span>${{ product.variants?.[0]?.price }}</span>
                    </ng-template>
                </p>

                <div class="countdown">
                    <div>{{ timeLeft.days }}<span>Days</span></div>
                    <div>{{ timeLeft.hours }}<span>Hours</span></div>
                    <div>{{ timeLeft.minutes }}<span>Minutes</span></div>
                    <div>{{ timeLeft.seconds }}<span>Seconds</span></div>
                </div>

                <div class="actions">
                    <span 
                        *ngIf="getDiscountPercent(product.variants?.[0]?.price, product.variants?.[0]?.discountPrice) as discount" 
                        class="badge text-bg-danger d-flex align-items-center justify-content-center fs-6">
                        -{{ discount }}%
                    </span>          
                    <button class="btn btn-outline-secondary" (click)="addToCart(product)">Add to Cart</button>                                  
                </div>
            </div>
        </div>
    </div>
</ng-container>
