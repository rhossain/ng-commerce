<div class="input-group rounded-pill border shadow-sm" style="max-width: 600px;">
    <!-- Dropdown -->
    <div class="dropdown">
        <button class="btn border-0 dropdown-toggle text-muted px-3 bg-white" type="button" id="categoryDropdown"
            data-bs-toggle="dropdown" aria-expanded="false">
            {{ selectedCategory }}
        </button>
        <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
            <li *ngFor="let category of categories">
                <a class="dropdown-item" (click)="selectCategory(category)">{{ category }}</a>
            </li>
        </ul>
    </div>

    <!-- Divider -->
    <div class="vr my-2 mx-1"></div>

    <!-- Input -->
    <input type="text" class="form-control border-0 bg-white" placeholder="I'm shopping for..."
        [(ngModel)]="searchText">

    <!-- Mic or icon (optional) -->
    <!-- <button class="btn bg-danger text-white rounded-2 px-2">
        <i class="bi bi-three-dots"></i>
    </button> -->

    <!-- Search Button -->
    <button class="btn btn-primary text-white px-4" (click)="onSearch()">
        Search
    </button>
</div>
