<!-- Simplified search.component.html -->
<div class="search-container position-relative" style="max-width: 600px;">
  <div class="input-group rounded-pill border shadow-sm bg-white">
    
    <!-- Category Dropdown -->
    <div class="dropdown">
      <button 
        class="btn border-0 dropdown-toggle text-muted px-3 bg-white search-category-btn" 
        type="button" 
        id="categoryDropdown"
        data-bs-toggle="dropdown" 
        aria-expanded="false"
        [disabled]="isSearching">
        {{ selectedCategory }}
      </button>
      <ul class="dropdown-menu dropdown-menu-start" aria-labelledby="categoryDropdown">
        <li *ngFor="let category of categories; trackBy: trackByIndex">
          <a 
            class="dropdown-item d-flex justify-content-between align-items-center" 
            (click)="selectCategory(category)"
            [class.active]="selectedCategory === category.name">
            <span>{{ category.name }}</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Divider -->
    <div class="vr my-2 mx-1"></div>

    <!-- Search Input -->
    <input 
      #searchInput
      type="text" 
      class="form-control border-0 bg-white search-input" 
      placeholder="I'm shopping for..."
      [(ngModel)]="searchText"
      (input)="onSearchInput()"
      (focus)="onSearchFocus()"
      (blur)="onSearchBlur()"
      (keydown)="onKeyDown($event)"
      [disabled]="isSearching"
      autocomplete="off">

    <!-- Clear Button -->
    <button 
      *ngIf="searchText" 
      type="button"
      class="btn btn-link text-muted p-2 clear-btn"
      (click)="clearSearch()"
      aria-label="Clear search">
      <i class="bi bi-x-circle"></i>
    </button>

    <!-- Search Button -->
    <button 
      class="btn btn-primary text-white px-4 search-btn" 
      (click)="onSearch()"
      [disabled]="isSearching">
      <span *ngIf="!isSearching">Search</span>
      <span *ngIf="isSearching" class="d-flex align-items-center">
        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
        Searching...
      </span>
    </button>
  </div>

  <!-- Real-time Suggestions & Search History Dropdown -->
  <div 
    *ngIf="showSuggestions || showHistory || isLoadingSuggestions" 
    class="search-dropdown position-absolute w-100 bg-white border rounded shadow-lg mt-1"
    style="z-index: 1050; max-height: 400px; overflow-y: auto;">
    
    <!-- Loading State -->
    <div *ngIf="isLoadingSuggestions" class="p-3 text-center text-muted">
      <span class="spinner-border spinner-border-sm me-2"></span>
      Loading suggestions...
    </div>

    <!-- Real-time Suggestions -->
    <div *ngIf="showSuggestions && !isLoadingSuggestions">
      <div class="px-3 py-2 bg-light border-bottom">
        <small class="text-muted fw-bold">SUGGESTIONS</small>
      </div>
      <div 
        *ngFor="let suggestion of searchSuggestions; let i = index; trackBy: trackByText"
        [class]="getSuggestionClass(i)"
        (click)="selectSuggestion(suggestion)">
        <div class="d-flex align-items-center p-3">
          <i class="bi bi-search me-2 text-muted"></i>
          <span>{{ suggestion }}</span>
        </div>
      </div>
    </div>

    <!-- Search History -->
    <div *ngIf="showHistory && searchHistory.length > 0 && !isLoadingSuggestions">
      <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-light border-bottom">
        <small class="text-muted fw-bold">RECENT SEARCHES</small>
        <button 
          class="btn btn-sm btn-outline-secondary"
          (click)="clearSearchHistory()"
          style="font-size: 0.75rem; padding: 0.125rem 0.5rem;">
          Clear
        </button>
      </div>
      <div 
        *ngFor="let historyItem of searchHistory; trackBy: trackByText"
        class="suggestion-item"
        (click)="selectHistoryItem(historyItem)">
        <div class="d-flex align-items-center p-3">
          <i class="bi bi-clock-history me-2 text-muted"></i>
          <span>{{ historyItem }}</span>
        </div>
      </div>
    </div>

    <!-- No Results -->
    <div *ngIf="!isLoadingSuggestions && !showSuggestions && !showHistory" class="p-3 text-center text-muted">
      <i class="bi bi-search"></i>
      <div class="mt-2">Start typing to search...</div>
    </div>
  </div>
</div>
