<!-- Main content -->
<main role="main" class="main-content">
    <div class="mobile-gradient">
        <div class="overlay"></div>
    </div>

    <!-- Slider section -->
    <div class="mb-2 main-content-top">
        <div class="container">
            <div class="row">
                <div class="col-12 offset-0 col-md-12 offset-md-0 col-lg-12 offset-lg-0 col-xl-9 offset-xl-3 main-content-top-wrapper">
                    <div class="main-content-top-contents">
                        <app-product-slider class="d-block h-100" [productIds]="[13, 14, 15]"></app-product-slider>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ./Slider section -->

    <!-- Featured category - Grid -->
    <div class="">
        <div class="container">
            <app-featured-category
                [categories]="categories"
                [styleType]="'grid'"
                [onlyCategoryIds]="[1, 3, 9, 2, 4, 5]"
                (categorySelected)="onCategorySelect($event)">
            </app-featured-category>
        </div>
    </div>
    <!-- ./Featured category - Grid -->

</main>
<!-- ./Main content -->
