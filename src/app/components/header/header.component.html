<header class="header" [ngClass]="isHomeRoute() ? 'header-home' : ''">

    <!-- Header - top -->
    <div class="header-top">
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-4">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start header-top-left">
                        <a href="mailto:demo@domain.com" class="mb-0 text-muted">
                            <i class="pe-7s-mail pegk fs-14 me-1 align-middle"></i> demo&#64;domain.com
                        </a>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="d-flex align-items-center justify-content-center header-top-center">
                        <div class="header-text text-center fs-12 py-1 py-lg-0">
                            Summer sale discount off
                            <span class="text-danger">50%</span>! <a routerlink="/shop" class="text-reset">Shop Now</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-end header-top-right">
                        <div class="text-md-end text-center">
                            <span>Call Us: 123 - 456 - 7890</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ./Header - top -->

    <!-- Header - middle -->
    <div class="w-100 header-middle">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex flex-column flex-md-row justify-content-between w-100 header-middle-inner">
                        <div class="d-flex align-items-center justify-content-start justify-content-md-center justify-content-md-start header-middle-left">
                            <!-- <button class="navbar-toggler d-inline-block d-md-none" type="button"
                                data-bs-toggle="collapse-side" data-bs-target=".header-bottom" data-target-2=".header"
                                data-target-3=".main-content" aria-controls="navbarSupportedContent"
                                aria-expanded="false" aria-label="Toggle navigation">
                                <div class="position-relative mx-auto my-0 navbar-toggler-btn">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </button> -->
                            <a class="d-inline-block d-md-none" (click)="toggleNavbarSidebar()">
                                <h1 class="mb-0 d-none d-md-block logo-text">ng<span>C</span>ommerce</h1>
                                <h1 class="mb-0 d-block d-md-none logo-text--white">ng<span>C</span>ommerce</h1>
                            </a>
                            <a class="navbar-brand" href="#">
                                <h1 class="mb-0 d-none d-md-block logo-text">ng<span>C</span>ommerce</h1>
                                <h1 class="mb-0 d-block d-md-none logo-text--white">ng<span>C</span>ommerce</h1>
                            </a>
                        </div>
                        <div class="d-flex align-items-center justify-content-center header-middle-center">
                            <app-search></app-search>
                        </div>
                        <div class="d-flex align-items-center header-middle-right">
                            <div class="d-flex justify-content-center align-items-center d-md-none search-box-icon">
                                <i class="fas fa-lg fa-search"></i>
                            </div>
                            <app-cart
                                (cartClosed)="onSidebarClosed()">
                            </app-cart>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ./Header - middle -->

    <!-- Header - bottom -->
    <div class="header-bottom w-100 collapsed">
        <div class="container">
            <app-navbar class="d-block w-100"></app-navbar>
        </div>
    </div>
    <!-- ./Header - bottom -->

</header>

<app-sidebar
    id="navbarId" 
    title="Navbar"
    width="300px">
    Sidebar content
</app-sidebar>
