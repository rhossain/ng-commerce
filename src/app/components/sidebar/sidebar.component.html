<div class="sidebar-wrapper">
    <!-- Overlay -->
    <div class="sidebar-overlay" [ngClass]="overlayClasses" (click)="close()"></div>

    <!-- Sidebar -->
    <aside 
        class="sidebar" 
        [class.left]="position === 'left'"
        [class.right]="position === 'right'"
        [class.open]="isOpen"
        [style.width]="width">
        <div class="sidebar-header d-flex justify-content-between align-items-center p-3 text-dark border-bottom">
            <h5 class="m-0">{{title}}</h5>
            <button class="btn btn-close" (click)="close()" aria-label="Close sidebar"></button>
        </div>

        <div class="sidebar-content text-dark">
            <ng-content></ng-content>
        </div>
    </aside>
</div>
